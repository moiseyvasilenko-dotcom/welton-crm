<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Welton CRM</title>
  <link rel="stylesheet" href="./styles.css?v=6">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-copy">
        <span class="app-name">Welton CRM</span>
        <h1 id="pageTitle">Обзор</h1>
      </div>
      <button class="round-button" id="searchToggle" type="button" aria-label="Открыть поиск">
        <span data-icon="search"></span>
      </button>
    </header>

    <section class="search-wrap" id="searchPanel" hidden>
      <label class="search-field">
        <span data-icon="search"></span>
        <input id="searchInput" type="search" placeholder="Поиск" autocomplete="off" enterkeyhint="search">
        <button id="clearSearch" type="button" aria-label="Очистить поиск" hidden><span data-icon="close-circle"></span></button>
      </label>
    </section>

    <main id="content" aria-live="polite"></main>

    <nav class="tabbar" aria-label="Разделы">
      <button class="tab active" type="button" data-tab="home"><span class="tab-icon" data-icon="home"></span><span>Обзор</span></button>
      <button class="tab" type="button" data-tab="clients"><span class="tab-icon" data-icon="users"></span><span>Клиенты</span></button>
      <button class="tab" type="button" data-tab="deals"><span class="tab-icon" data-icon="briefcase"></span><span>Сделки</span></button>
      <button class="tab" type="button" data-tab="tasks"><span class="tab-icon" data-icon="check-circle"></span><span>Задачи</span></button>
    </nav>

    <button id="fallbackMainButton" class="fallback-main" type="button" aria-label="Добавить">
      <span data-icon="plus"></span>
    </button>
  </div>

  <dialog id="editorDialog" aria-labelledby="dialogTitle">
    <form id="editorForm">
      <header class="dialog-head">
        <button class="dialog-link" id="cancelEditor" type="button">Отмена</button>
        <h2 id="dialogTitle">Новая запись</h2>
        <button class="dialog-link dialog-save" id="saveButton" type="submit">Готово</button>
      </header>
      <div id="formFields" class="form-content"></div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="./app.js?v=6"></script>
</body>
</html>
